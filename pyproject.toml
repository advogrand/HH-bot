[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "hh-telegram-bot"
version = "0.1.0"
description = "Semi-automatic Telegram bot for safe hh.ru vacancy response dry-runs."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.7",
    "fastapi>=0.111",
    "httpx>=0.27",
    "playwright>=1.49",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
